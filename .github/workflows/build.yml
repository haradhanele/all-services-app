name: Build Android APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Find and Extract ZIP
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_app
          PROJECT_DIR=$(find extracted_app -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        else
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        fi

    - name: Generate Keystore & Configs
      run: |
        # Generate debug.keystore
        keytool -genkey -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        # Copy keystore to all possible directories
        cp /tmp/debug.keystore "$PROJECT_DIR/debug.keystore" || true
        cp /tmp/debug.keystore extracted_app/debug.keystore || true
        cp /tmp/debug.keystore ./debug.keystore || true
        find . -type d | while read -r d; do
          cp /tmp/debug.keystore "$d/debug.keystore" 2>/dev/null || true
        done

        # Add Mock google-services.json
        MOCK_JSON='{
          "project_info": {
            "project_number": "123456789012",
            "project_id": "samiti-app-mock",
            "storage_bucket": "samiti-app-mock.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef123456",
                "android_client_info": {
                  "package_name": "com.aistudio.samitifund.mgxpqr"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "mock_api_key"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }'
        find . -type d -name "app" | while read -r app_dir; do
          echo "$MOCK_JSON" > "$app_dir/google-services.json"
        done

    - name: Make gradlew executable
      run: |
        cd "$PROJECT_DIR"
        chmod +x gradlew || true

    - name: Build APK
      run: |
        cd "$PROJECT_DIR"
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Samiti-App-APK
        path: "**/build/outputs/apk/debug/*.apk"
        

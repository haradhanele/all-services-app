name: Build Android APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Find and Extract ZIP
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_app
          PROJECT_DIR=$(find extracted_app -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        else
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        fi

    - name: Fix Keystore and Build Configs
      run: |
        # 1. Create default debug.keystore
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        # 2. Copy keystore to project root and app root
        cp ~/.android/debug.keystore "$PROJECT_DIR/debug.keystore" || true
        find "$PROJECT_DIR" -maxdepth 3 -type d -name "app" | while read -r app_dir; do
          cp ~/.android/debug.keystore "$app_dir/debug.keystore" || true
        done

        # 3. Add Mock google-services.json
        MOCK_JSON='{
          "project_info": {
            "project_number": "123456789012",
            "project_id": "samiti-app-mock",
            "storage_bucket": "samiti-app-mock.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef123456",
                "android_client_info": {
                  "package_name": "com.aistudio.samitifund.mgxpqr"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "mock_api_key"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }'
        find "$PROJECT_DIR" -maxdepth 3 -type d -name "app" | while read -r app_dir; do
          echo "$MOCK_JSON" > "$app_dir/google-services.json"
        done

        # 4. Remove invalid signing config requirements from gradle files
        find "$PROJECT_DIR" -name "build.gradle*" | while read -r gfile; do
          sed -i '/signingConfig signingConfigs.debug/d' "$gfile" || true
        done

    - name: Make gradlew executable
      run: |
        cd "$PROJECT_DIR"
        chmod +x gradlew || true

    - name: Build APK
      run: |
        cd "$PROJECT_DIR"
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug -x validateSigningDebug --stacktrace
        else
          gradle assembleDebug -x validateSigningDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Samiti-App-APK
        path: "**/build/outputs/apk/**/*.apk"
        

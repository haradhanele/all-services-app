name: Build Android APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Find and Extract ZIP
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_app
          SETTINGS_FILE=$(find extracted_app -name "settings.gradle*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            PROJECT_DIR=$(find extracted_app -name "build.gradle*" | head -n 1 | xargs dirname)
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        else
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        fi

    - name: Replace App Name with All Services Group
      run: |
        find "$PROJECT_DIR" -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.gradle*" \) | while read -r file; do
          sed -i 's/Samiti Fund/All Services Group/g' "$file" || true
          sed -i 's/SamitiFund/AllServicesGroup/g' "$file" || true
          sed -i 's/Samiti fund/All services group/g' "$file" || true
          sed -i 's/samiti fund/All services group/g' "$file" || true
        done

    - name: Fix Keystore and Configs
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        cp ~/.android/debug.keystore "$PROJECT_DIR/debug.keystore" || true
        find "$PROJECT_DIR" -maxdepth 3 -type d -name "app" | while read -r app_dir; do
          cp ~/.android/debug.keystore "$app_dir/debug.keystore" || true
        done

        MOCK_JSON='{"project_info":{"project_number":"123456789012","project_id":"samiti-app-mock","storage_bucket":"samiti-app-mock.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef123456","android_client_info":{"package_name":"com.aistudio.samitifund.mgxpqr"}},"oauth_client":[],"api_key":[{"current_key":"mock_api_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}'
        find "$PROJECT_DIR" -maxdepth 3 -type d -name "app" | while read -r app_dir; do
          echo "$MOCK_JSON" > "$app_dir/google-services.json"
        done

        find "$PROJECT_DIR" -name "build.gradle*" | while read -r gfile; do
          sed -i '/signingConfig signingConfigs.debug/d' "$gfile" || true
        done

    - name: Clean Conflicting Overloads
      run: |
        find "$PROJECT_DIR" -name "*CustomView*.kt" -delete || true

    - name: Update Reports UI Screen
      run: |
        python3 -c "
        import os, base64, gzip

        b64 = ''
        code = gzip.decompress(base64.b64decode(b64)).decode('utf-8')

        pdir = os.environ.get('PROJECT_DIR', '.')
        for root, dirs, files in os.walk(pdir):
            for file in files:
                if ('Report' in file or 'report' in file or 'Financial' in file) and file.endswith('.kt') and 'Exporter' not in file and 'ViewModel' not in file:
                    fp = os.path.join(root, file)
                    pkg = 'package com.example.ui.screens'
                    with open(fp, 'r', encoding='utf-8', errors='ignore') as f:
                        for line in f:
                            if line.strip().startswith('package '):
                                pkg = line.strip()
                                break
                    with open(fp, 'w', encoding='utf-8') as f:
                        f.write(code.replace('package com.aistudio.samitifund.ui.screens', pkg))
                    print('Successfully replaced:', fp)
        "

    - name: Build APK
      run: |
        cd "$PROJECT_DIR"
        gradle assembleDebug -x validateSigningDebug -Pkotlin.compiler.suppressKotlinVersionCompatibilityCheck=true --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: All-Services-Group-APK
        path: "**/build/outputs/apk/**/*.apk"
        

name: Build Android APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Find and Extract ZIP
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_app
          SETTINGS_FILE=$(find extracted_app -name "settings.gradle*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            PROJECT_DIR=$(find extracted_app -name "build.gradle*" | head -n 1 | xargs dirname)
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        else
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        fi

    - name: Replace App Name with All Services Group
      run: |
        find "$PROJECT_DIR" -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.gradle*" \) | while read -r file; do
          sed -i 's/Samiti Fund/All Services Group/g' "$file" || true
          sed -i 's/SamitiFund/AllServicesGroup/g' "$file" || true
          sed -i 's/Samiti fund/All services group/g' "$file" || true
          sed -i 's/samiti fund/All services group/g' "$file" || true
        done

    - name: Fix Keystore and Configs
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        cp ~/.android/debug.keystore "$PROJECT_DIR/debug.keystore" || true
        find "$PROJECT_DIR" -maxdepth 3 -type d -name "app" | while read -r app_dir; do
          cp ~/.android/debug.keystore "$app_dir/debug.keystore" || true
        done

        MOCK_JSON='{"project_info":{"project_number":"123456789012","project_id":"samiti-app-mock","storage_bucket":"samiti-app-mock.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef123456","android_client_info":{"package_name":"com.aistudio.samitifund.mgxpqr"}},"oauth_client":[],"api_key":[{"current_key":"mock_api_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}'
        find "$PROJECT_DIR" -maxdepth 3 -type d -name "app" | while read -r app_dir; do
          echo "$MOCK_JSON" > "$app_dir/google-services.json"
        done

        find "$PROJECT_DIR" -name "build.gradle*" | while read -r gfile; do
          sed -i '/signingConfig signingConfigs.debug/d' "$gfile" || true
        done

    - name: Overwrite All Report Screen Variations
      run: |
        REPORTS_B64=""
        
        find "$PROJECT_DIR" -name "*Report*Screen.kt" -o -name "ReportsScreen.kt" -o -name "ReportScreen.kt" | while read -r rfile; do
          echo "$REPORTS_B64" | base64 -d | sed 's/androidx0compose/androidx.compose/g' > "$rfile"
        done

        CHAT_CODE='package com.example.ui.screens\n\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\n\n@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nfun SocietyChatScreen(viewModel: Any? = null, onNavigateToMemberProfile: ((Any?) -> Unit)? = null, onNavigateBack: () -> Unit = {}) {\n    Scaffold(topBar = { TopAppBar(title = { Text("Chat") }) }) {\n        Box(modifier = Modifier.fillMaxSize().padding(it), contentAlignment = Alignment.Center) {\n            Text("Chat Screen")\n        }\n    }\n}'
        find "$PROJECT_DIR" -name "SocietyChatScreen.kt" | while read -r cfile; do
          printf "%b" "$CHAT_CODE" > "$cfile"
        done

    - name: Build APK
      run: |
        cd "$PROJECT_DIR"
        gradle assembleDebug -x validateSigningDebug -Pkotlin.compiler.suppressKotlinVersionCompatibilityCheck=true --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: All-Services-Group-APK
        path: "**/build/outputs/apk/**/*.apk"
        

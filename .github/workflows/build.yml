name: Build Android APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Find and Extract ZIP
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_app
          SETTINGS_FILE=$(find extracted_app -name "settings.gradle*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            PROJECT_DIR=$(find extracted_app -name "build.gradle*" | head -n 1 | xargs dirname)
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        else
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        fi

    - name: Replace App Name with All Services Group
      run: |
        find "$PROJECT_DIR" -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.gradle*" \) | while read -r file; do
          sed -i 's/Samiti Fund/All Services Group/g' "$file" || true
          sed -i 's/SamitiFund/AllServicesGroup/g' "$file" || true
          sed -i 's/Samiti fund/All services group/g' "$file" || true
          sed -i 's/samiti fund/All services group/g' "$file" || true
        done

    - name: Fix Keystore and Configs
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        cp ~/.android/debug.keystore "$PROJECT_DIR/debug.keystore" || true
        find "$PROJECT_DIR" -maxdepth 3 -type d -name "app" | while read -r app_dir; do
          cp ~/.android/debug.keystore "$app_dir/debug.keystore" || true
        done

        MOCK_JSON='{"project_info":{"project_number":"123456789012","project_id":"samiti-app-mock","storage_bucket":"samiti-app-mock.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef123456","android_client_info":{"package_name":"com.aistudio.samitifund.mgxpqr"}},"oauth_client":[],"api_key":[{"current_key":"mock_api_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}'
        find "$PROJECT_DIR" -maxdepth 3 -type d -name "app" | while read -r app_dir; do
          echo "$MOCK_JSON" > "$app_dir/google-services.json"
        done

        find "$PROJECT_DIR" -name "build.gradle*" | while read -r gfile; do
          sed -i '/signingConfig signingConfigs.debug/d' "$gfile" || true
        done

    - name: Deep Replace Reports UI in All Matching Files
      run: |
        find "$PROJECT_DIR" -type f \( -name "*Report*Screen*.kt" -o -name "*Reports*Screen*.kt" -o -name "*Financial*Screen*.kt" \) ! -name "*Exporter*" ! -name "*ViewModel*" | while read -r target; do
          PKG_LINE=$(grep "^package " "$target" | head -n 1)
          if [ -z "$PKG_LINE" ]; then
            PKG_LINE="package com.aistudio.samitifund.ui.screens"
          fi

          cat << 'EOF' > "$target"
        PACKAGE_LINE_REPLACE

        import androidx.compose.foundation.background
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.lazy.LazyColumn
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun ReportsScreen(viewModel: Any? = null, onNavigateToSettings: (() -> Unit)? = null, onNavigateBack: () -> Unit = {}) {
            FinancialReportGlobalView()
        }

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun ReportScreen(viewModel: Any? = null, onNavigateToSettings: (() -> Unit)? = null, onNavigateBack: () -> Unit = {}) {
            FinancialReportGlobalView()
        }

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun FinancialReportScreen(viewModel: Any? = null, onNavigateToSettings: (() -> Unit)? = null, onNavigateBack: () -> Unit = {}) {
            FinancialReportGlobalView()
        }

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun FinancialReportsScreen(viewModel: Any? = null, onNavigateToSettings: (() -> Unit)? = null, onNavigateBack: () -> Unit = {}) {
            FinancialReportGlobalView()
        }

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun FinancialReportGlobalView() {
            Scaffold(
                topBar = {
                    TopAppBar(
                        title = { Text("Financial Reports", fontWeight = FontWeight.Bold) }
                    )
                }
            ) { innerPadding ->
                LazyColumn(
                    modifier = Modifier
                        .fillMaxSize()
                        .padding(innerPadding)
                        .padding(16.dp),
                    verticalArrangement = Arrangement.spacedBy(16.dp)
                ) {
                    item {
                        Surface(
                            modifier = Modifier.fillMaxWidth(),
                            shape = RoundedCornerShape(16.dp),
                            color = Color(0xFF1E3A8A)
                        ) {
                            Column(modifier = Modifier.padding(20.dp)) {
                                Text(text = "Total Collected Fund", color = Color.White.copy(alpha = 0.8f), fontSize = 14.sp)
                                Text(text = "Rs. 5,400.00", color = Color.White, fontSize = 28.sp, fontWeight = FontWeight.Bold)
                                Spacer(modifier = Modifier.height(12.dp))
                                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                    Text(text = "Active Members: 17", color = Color.White, fontSize = 14.sp)
                                    Text(text = "Target: Rs. 10,200", color = Color.White.copy(alpha = 0.9f), fontSize = 14.sp)
                                }
                            }
                        }
                    }

                    item {
                        Text(text = "Monthly Summary", fontWeight = FontWeight.Bold, fontSize = 18.sp)
                    }

                    item {
                        Surface(
                            modifier = Modifier.fillMaxWidth(),
                            shape = RoundedCornerShape(12.dp),
                            color = Color(0xFFE2E8F0)
                        ) {
                            Column(modifier = Modifier.padding(16.dp)) {
                                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                    Text(text = "July 2026", fontWeight = FontWeight.SemiBold)
                                    Text(text = "Rs. 2,700.00", color = Color(0xFF2E7D32), fontWeight = FontWeight.Bold)
                                }
                                Spacer(modifier = Modifier.height(4.dp))
                                Text(text = "Paid: 9 Members | Due: 8 Members", fontSize = 12.sp)
                                Divider(modifier = Modifier.padding(vertical = 8.dp))
                                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                    Text(text = "August 2026", fontWeight = FontWeight.SemiBold)
                                    Text(text = "Rs. 2,700.00", color = Color(0xFF2E7D32), fontWeight = FontWeight.Bold)
                                }
                                Spacer(modifier = Modifier.height(4.dp))
                                Text(text = "Paid: 9 Members | Due: 8 Members", fontSize = 12.sp)
                            }
                        }
                    }

                    item {
                        Text(text = "Overall Status", fontWeight = FontWeight.Bold, fontSize = 18.sp)
                    }

                    item {
                        Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                            Surface(
                                modifier = Modifier.weight(1f),
                                shape = RoundedCornerShape(12.dp),
                                color = Color(0xFFE8F5E9)
                            ) {
                                Column(modifier = Modifier.padding(16.dp)) {
                                    Text(text = "Paid Total", color = Color(0xFF2E7D32), fontSize = 12.sp)
                                    Text(text = "Rs. 5,400", color = Color(0xFF1B5E20), fontSize = 20.sp, fontWeight = FontWeight.Bold)
                                }
                            }

                            Surface(
                                modifier = Modifier.weight(1f),
                                shape = RoundedCornerShape(12.dp),
                                color = Color(0xFFFFEBEE)
                            ) {
                                Column(modifier = Modifier.padding(16.dp)) {
                                    Text(text = "Pending Due", color = Color(0xFFC62828), fontSize = 12.sp)
                                    Text(text = "Rs. 4,800", color = Color(0xFFB71C1C), fontSize = 20.sp, fontWeight = FontWeight.Bold)
                                }
                            }
                        }
                    }
                }
            }
        }
        EOF
          sed -i "s|PACKAGE_LINE_REPLACE|$PKG_LINE|g" "$target"
        done

    - name: Clean and Build Fresh APK
      run: |
        cd "$PROJECT_DIR"
        gradle clean
        gradle assembleDebug -x validateSigningDebug --no-build-cache -Pkotlin.compiler.suppressKotlinVersionCompatibilityCheck=true --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: All-Services-Group-APK
        path: "**/build/outputs/apk/**/*.apk"
        

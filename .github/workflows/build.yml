name: Build Android APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Find and Extract ZIP
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_app
          SETTINGS_FILE=$(find extracted_app -name "settings.gradle*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            PROJECT_DIR=$(find extracted_app -name "build.gradle*" | head -n 1 | xargs dirname)
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        else
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        fi

    - name: Fix Keystore, Configs and KSP Settings
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        cp ~/.android/debug.keystore "$PROJECT_DIR/debug.keystore" || true
        find "$PROJECT_DIR" -maxdepth 3 -type d -name "app" | while read -r app_dir; do
          cp ~/.android/debug.keystore "$app_dir/debug.keystore" || true
        done

        # Copy real google-services.json from repository root into app directory
        if [ -f "./google-services.json" ]; then
          find "$PROJECT_DIR" -maxdepth 3 -type d -name "app" | while read -r app_dir; do
            cp ./google-services.json "$app_dir/google-services.json"
          done
        fi

        # Fix KSP crash on Gradle 9+
        echo "org.gradle.jvmargs=-Xmx4g -Djava.awt.headless=true" >> "$PROJECT_DIR/gradle.properties"
        echo "ksp.incremental=false" >> "$PROJECT_DIR/gradle.properties"

        find "$PROJECT_DIR" -name "build.gradle*" | while read -r gfile; do
          sed -i '/signingConfig signingConfigs.debug/d' "$gfile" || true
        done

    - name: Clean Extra Custom Files
      run: |
        find "$PROJECT_DIR" -name "*CustomView*.kt" -delete || true

    - name: Build APK
      run: |
        cd "$PROJECT_DIR"
        gradle assembleDebug -x validateSigningDebug -Djava.awt.headless=true -Pkotlin.compiler.suppressKotlinVersionCompatibilityCheck=true --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Group-Ledger-APK
        path: "**/build/outputs/apk/**/*.apk"
        
